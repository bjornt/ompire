# Documentation site. Authoring rules: ADR-0020
# (docs/adr/0020-author-documentation-as-portable-markdown.md)
#
# The generator is a presentation layer only. Every page must remain readable
# as plain Markdown without it — no admonitions, no generator-specific
# directives in page bodies. Mermaid fences are the one exception: GitHub
# renders them natively too.

site_name: Ompire
site_description: Local-first control plane for coding-agent work
docs_dir: docs
site_dir: site

# Structure: ADR-0019
# (docs/adr/0019-split-documentation-by-audience-using-diataxis.md)
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

