name: dev
base: ubuntu@26.04
sdks:
  - name: node
    channel: 24
  - name: project-ompire-dev-setup
  - name: uv
  # Headless Chrome for driving the frontend during local end-to-end checks.
  # Provides `pptr-node` and PUPPETEER_EXECUTABLE_PATH — see
  # docs/develop/reference/local-testing.md#browser
  - name: puppeteer-chrome
actions:
  test-backend: |
    cd /project/daemon
    uv run pytest "$@"
  test-frontend: |
    cd /project/frontend
    pnpm test "$@"
  lint-backend: |
    cd /project/daemon
    uvx ruff check src tests "$@"
  lint-frontend: |
    cd /project/frontend
    pnpm lint "$@"
  typecheck-backend: |
    cd /project/daemon
    uv run --with mypy mypy src "$@"
  typecheck-frontend: |
    cd /project/frontend
    pnpm exec tsc -b "$@"
  docs: |
    cd /project
    NO_MKDOCS_2_WARNING=1 uvx --with mkdocs-material mkdocs build --strict "$@"
