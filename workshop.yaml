name: dev
base: ubuntu@26.04
sdks:
  - name: node
    channel: 24
  - name: project-ompire-dev-setup
  - name: uv
  # Headless Chrome for driving the frontend during local end-to-end checks.
  # Provides `pptr-node` and PUPPETEER_EXECUTABLE_PATH — see
  # docs/develop/reference/local-testing.md#browser
  - name: puppeteer-chrome
# Actions delegate to the project Makefile so they stay in sync with it.
# Positional arguments are forwarded through the Makefile's ARGS variable:
#   <action> -k test_ship  →  make test-backend ARGS="-k test_ship"
actions:
  test-backend: |
    cd /project && make test-backend ARGS="$*"
  test-frontend: |
    cd /project && make test-frontend ARGS="$*"
  lint-backend: |
    cd /project && make lint-backend ARGS="$*"
  lint-frontend: |
    cd /project && make lint-frontend ARGS="$*"
  typecheck-backend: |
    cd /project && make typecheck-backend ARGS="$*"
  typecheck-frontend: |
    cd /project && make typecheck-frontend ARGS="$*"
  docs: |
    cd /project && make docs ARGS="$*"
