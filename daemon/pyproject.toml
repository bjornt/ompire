# Trusted control-plane runtime and dependency boundary: ADR-0003
# (docs/adr/0003-implement-trusted-control-plane-in-python.md)

[project]
name = "ompire-daemon"
version = "0.1.0"
description = "ompire daemon: process lifecycle, registry, REST/WS API"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "Bjorn Tillenius", email = "bjorn@tillenius.me" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Workflow definitions are YAML documents (ADR-0028). Loaded through a
    # restricted event/node walk, never `yaml.load` with an object
    # constructor, so this is a parser dependency and not a deserializer.
    "pyyaml>=6.0",
]

[project.scripts]
ompire-daemon = "ompire_daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx2>=2.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
# PyYAML ships no type information. Only the parser edge is untyped; every
# value crossing out of it is validated into the definition model right here.
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/**" = ["B008", "S110"]
"tests/**" = ["B008", "ASYNC221"]


