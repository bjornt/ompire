[project]
name = "ompire-daemon"
version = "0.1.0"
description = "ompire daemon: process lifecycle, registry, REST/WS API"
readme = "README.md"
authors = [
    { name = "Bjorn Tillenius", email = "bjorn@tillenius.me" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.scripts]
ompire-daemon = "ompire_daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
