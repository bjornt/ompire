# The simplest complete workflow (format 5): one session does the work, an
# independent reviewer reads what it would publish, and a person decides what
# happens to it.
#
#   work ──► review ─┬─ approved ──► approve ─┬─ nothing
#     ▲              │                        ├─ a local signed commit
#     └── comments ──┘                        ├─ a pushed branch
#                                             └─ a pull request
#
# Review, approval, and signed delivery reference the global shared-step library.
# The correction loop remains explicit and bounded by work's three-visit limit.
#
# And publishing is a step. Finishing the work authorizes nothing; the gate
# asks, and each approving answer grants exactly the chain it names. Choosing
# to finish without publishing is a real, named ending — not a failure.
format: 5
name: single-step
sessions: [main]
primary: main
steps:
  # 1. The work itself: the operator's prompt, and nothing the engine added.
  #    The declared result exists so a later step has something to read — and
  #    so the optional publication text below comes from the session that did
  #    the work, before review, rather than from a hidden drafting turn at the
  #    approval.
  - name: work
    kind: agent
    session: main
    role: default
    max_visits: 3
    on_exhausted: {step: correction-exhausted}
    evidence:
      # The reviewer's report, when this is a correction round. `after: work`
      # anchors it to the round that produced it, so one review's comments can
      # never be re-served to a later attempt.
      review: {steps: [review], after: work, required: false}
    outcome:
      results:
        done:
          required:
            summary_text: string
            commit_message: string
            pr_title: string
            pr_body: string
    prompt:
      separator: ""
      parts:
        - if:
            op: ne
            left: {op: input, name: workspace.preamble}
            right: {op: literal, value: ""}
          then:
            separator: ""
            parts:
              - value: {op: input, name: workspace.preamble}
                format: text
              - text: "\n\n"
          else:
            parts: []
        - value: {op: input, name: task.prompt}
          format: text
        - if:
            op: all
            of:
              # `exists` is decisive for an absent optional selector, so a
              # first attempt — with no review behind it — takes the plain
              # route instead of leaving the whole prompt unrenderable.
              - op: exists
                value:
                  op: get
                  value: {op: evidence, name: review}
                  keys: [outcome, findings_state]
              - op: eq
                left:
                  op: get
                  value: {op: evidence, name: review}
                  keys: [outcome, findings_state]
                right: {op: literal, value: "complete"}
          then:
            separator: ""
            parts:
              - text: |-


                  An independent reviewer read your change and left comments. Address them
                  in the working tree. Their report, verbatim:

              - value:
                  op: get
                  value: {op: evidence, name: review}
                  keys: [outcome, findings]
                format: text
          else:
            parts: []
        - text: "\n\n"
        - text: |-
            When you are done, commit your work on the current branch. Do not push.

            Also propose the text a human would publish this under: a commit message,
            a pull-request title, and a pull-request body. They are suggestions — an
            operator reviews and edits them before anything is published, and nothing
            you write here authorizes publishing.

  - name: review
    use: review-and-route
    bindings:
      review_evidence:
        work:
          steps:
          - work
      route_evidence:
        verdict:
          steps:
          - review
      approved_cases:
      - when:
          op: eq
          left:
            op: get
            value:
              op: evidence
              name: verdict
            keys:
            - outcome
            - result
          right:
            op: literal
            value: approved
        next:
          step: approve
      correction_step: work
  - name: approve
    use: approval
    bindings:
      approval_name: approve
      evidence:
        verdict:
          steps:
          - review
        work:
          steps:
          - work
      message:
        separator: ''
        parts:
        - text: |
            The reviewer approved this change.

            What was done:
        - value:
            op: get
            value:
              op: evidence
              name: work
            keys:
            - outcome
            - artifacts
            - summary_text
          format: text
        - text: |2-


            Choose what happens to it. Finishing here is a complete, useful ending:
            the work stays on the branch and nothing is published. The other answers
            each authorize exactly the actions they name, against the content that
            was just reviewed, and nothing further.
      metadata:
        message:
          parts:
          - value:
              op: get
              value:
                op: evidence
                name: work
              keys:
              - outcome
              - artifacts
              - commit_message
            format: text
        pr_title:
          parts:
          - value:
              op: get
              value:
                op: evidence
                name: work
              keys:
              - outcome
              - artifacts
              - pr_title
            format: text
        pr_body:
          parts:
          - value:
              op: get
              value:
                op: evidence
                name: work
              keys:
              - outcome
              - artifacts
              - pr_body
            format: text
      choices:
      - id: finish
        label: Finish without publishing
        next:
          complete: true
          result: done-unpublished
      - id: request-changes
        label: Send it back with changes
        feedback_required: true
        next:
          step: work
      - id: commit-locally
        label: Make a local signed commit and stop
        next:
          step: commit-local
        authorize:
          steps:
          - commit-local
      - id: push-branch
        label: Sign and push the branch
        next:
          step: commit-for-push
        authorize:
          steps:
          - commit-for-push
          - push-branch
      - id: open-pr
        label: Sign, push, and open a pull request
        next:
          step: commit-for-pr
        authorize:
          steps:
          - commit-for-pr
          - push-for-pr
          - open-pr
  - name: commit-local
    use: signed-commit
    bindings:
      commit_step: commit-local
      approval_step: approve
      result: committed-locally
  - name: commit-for-push
    use: signed-push
    bindings:
      commit_step: commit-for-push
      approval_step: approve
      result: pushed
      push_step: push-branch
  - name: commit-for-pr
    use: signed-pr
    bindings:
      commit_step: commit-for-pr
      approval_step: approve
      result: pull-request-opened
      push_step: push-for-pr
      pr_step: open-pr
  # 6. The two exhaustion endings. Both are outside the loops they end, and
  #    neither offers publication: nothing here was approved.
  - name: correction-exhausted
    kind: gate
    message:
      parts:
        - text: |-
            The work has used up its three attempts for this run, and no answer here
            refills them. Whatever was done is still in the working tree, and the
            session stays available if you want to continue by hand.

            Stopping ends this run without publishing anything.
    choices:
      - id: stop
        label: Stop without publishing
        next: {complete: true, result: stopped-unpublished}

  - name: review-exhausted
    use: review-stop
    bindings:
      message:
        separator: ''
        parts:
        - text: 'Review did not approve this change. The last attempt ended as '
        - value:
            op: coalesce
            values:
            - op: get
              value:
                op: evidence
                name: verdict
              keys:
              - outcome
              - result
            - op: literal
              value: (no review was recorded)
          format: text
        - text: |-
            .

            Review allows three attempts per run and no answer here refills them.
            Nothing was approved, so nothing can be published from this run.
      result: stopped-unreviewed

stages:
- name: work
  label: Work
  description: Carry out the task and address complete review comments within the correction budget.
  steps:
  - work
  - correction-exhausted
- name: review
  label: Review
  description: Independently review the candidate; complete comments return to work.
  steps:
  - review
  - route-review
  - review-exhausted
- name: decide
  label: Decide
  description: Choose correction, no publication, a local commit, a push, or a pull request.
  steps:
  - approve
- name: publish
  label: Publish
  description: Carry out only the signed delivery chain you authorized.
  steps:
  - commit-local
  - commit-for-push
  - push-branch
  - commit-for-pr
  - push-for-pr
  - open-pr
